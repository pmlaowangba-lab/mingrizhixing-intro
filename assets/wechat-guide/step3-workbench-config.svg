<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .f { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif; }
      .m { font-family: "SF Mono", "Menlo", "Monaco", ui-monospace, monospace; }
    </style>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="mSh3" x="-10%" y="-10%" width="120%" height="126%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 模拟工作台背景暗化层 -->
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1200" height="675" fill="#0F172A" fill-opacity="0.24"/>

  <!-- 居中精工配置弹窗 -->
  <g filter="url(#mSh3)">
    <rect x="248" y="42" width="704" height="590" rx="22" fill="#FFFFFF"/>
    <rect x="248" y="42" width="704" height="4" rx="2" fill="#07C160"/>
    <text x="290" y="92" class="f" font-size="20" font-weight="700" fill="#0F172A">公众号账户管理</text>
    <text x="290" y="114" class="f" font-size="12.5" fill="#64748B">绑定后支持在工作台一键同步图文草稿与自动上传微信图床</text>
    <circle cx="912" cy="86" r="16" fill="#F1F5F9"/>
    <text x="912" y="92" text-anchor="middle" class="f" font-size="18" fill="#64748B">×</text>
    <line x1="248" y1="132" x2="952" y2="132" stroke="#EEF2F6" stroke-width="1"/>

    <!-- 字段 1 -->
    <rect x="284" y="152" width="632" height="90" rx="12" fill="#FFFDFD" stroke="#EF4444" stroke-width="2.2"/>
    <circle cx="916" cy="152" r="14" fill="#EF4444"/>
    <text x="916" y="157" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="304" y="178" class="f" font-size="13" font-weight="700" fill="#334155">公众号名称（自定义备注名）</text>
    <rect x="304" y="188" width="592" height="42" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="320" y="214" class="f" font-size="14.5" fill="#0F172A">我的AI效率笔记</text>

    <!-- 字段 2 -->
    <rect x="284" y="258" width="632" height="90" rx="12" fill="#FFFDFD" stroke="#EF4444" stroke-width="2.2"/>
    <circle cx="916" cy="258" r="14" fill="#EF4444"/>
    <text x="916" y="263" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="304" y="284" class="f" font-size="13" font-weight="700" fill="#334155">AppID（开发者 ID，以 wx 开头）</text>
    <rect x="304" y="294" width="592" height="42" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="320" y="320" class="m" font-size="14.5" font-weight="600" fill="#0F172A">wx8a9c7d2e4f1b6a09</text>

    <!-- 字段 3 -->
    <rect x="284" y="364" width="632" height="90" rx="12" fill="#FFFDFD" stroke="#EF4444" stroke-width="2.2"/>
    <circle cx="916" cy="364" r="14" fill="#EF4444"/>
    <text x="916" y="369" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="304" y="390" class="f" font-size="13" font-weight="700" fill="#334155">AppSecret（开发者密码，加密存储不明文回显）</text>
    <rect x="304" y="400" width="592" height="42" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="320" y="427" class="m" font-size="17" fill="#0F172A">••••••••••••••••••••••••</text>

    <!-- 浅绿直连说明条 -->
    <rect x="284" y="472" width="632" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="306" y="499" class="f" font-size="13.5" font-weight="600" fill="#065F46">✓ 默认直连微信官方接口（api.weixin.qq.com），无需配置固定代理</text>

    <!-- 底部操作栏 -->
    <line x1="248" y1="536" x2="952" y2="536" stroke="#F1F5F9" stroke-width="1"/>
    <text x="284" y="586" class="f" font-size="12.5" fill="#64748B">支持添加多个公众号，随时切换默认推送目标</text>

    <rect x="662" y="558" width="106" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="715" y="585" text-anchor="middle" class="f" font-size="14" font-weight="600" fill="#334155">测试连接</text>

    <!-- 红框 4：保存账户 -->
    <rect x="780" y="550" width="138" height="60" rx="12" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="918" cy="550" r="14" fill="#EF4444"/>
    <text x="918" y="555" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
    <rect x="788" y="558" width="122" height="44" rx="10" fill="#0F172A"/>
    <text x="849" y="585" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#FFFFFF">保存账户</text>
  </g>
</svg>
