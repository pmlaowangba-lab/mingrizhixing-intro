    <text x="738" y="478" text-anchor="end" class="f" font-size="13" font-weight="700" fill="#059669">已绑定</text>

    <!-- 子卡 3 -->
    <rect x="784" y="220" width="318" height="296" rx="16" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
    <circle cx="818" cy="258" r="14" fill="#07C160"/>
    <text x="818" y="263" text-anchor="middle" class="f" font-size="13.5" font-weight="700" fill="#FFFFFF">✓</text>
