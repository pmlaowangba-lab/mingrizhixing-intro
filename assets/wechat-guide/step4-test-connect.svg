    <text x="769" y="366" text-anchor="middle" class="f" font-size="18" fill="#94A3B8">→</text>

    <!-- 子卡 1 -->
    <rect x="98" y="220" width="318" height="296" rx="16" fill="#FAFBFD" stroke="#E2E8F0" stroke-width="1.2"/>
