    </linearGradient>
    <filter id="cSh4" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>

  <!-- 居中精工引导卡片 -->
