    <!-- 红框高亮测试联通按钮 -->
    <rect x="796" y="446" width="114" height="54" rx="12" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <rect x="804" y="454" width="98" height="38" rx="9" fill="#0F172A"/>
    <text x="853" y="478" text-anchor="middle" class="f" font-size="13.5" font-weight="700" fill="#FFFFFF">测试联通</text>
