<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .f { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif; }
    </style>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="covGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="pSh5" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg5)"/>

  <!-- 节点 5 主大卡片 -->
  <g filter="url(#pSh5)">
    <rect x="64" y="38" width="1072" height="598" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="106" cy="78" r="14" fill="#07C160"/>
    <text x="106" y="83" text-anchor="middle" class="f" font-size="13.5" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="132" y="85" class="f" font-size="19" font-weight="700" fill="#0F172A">5 · 一键发布草稿</text>
    <rect x="822" y="60" width="136" height="34" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="890" y="82" text-anchor="middle" class="f" font-size="12.5" font-weight="600" fill="#334155">⤢ 全屏终稿预览</text>
    <rect x="970" y="60" width="130" height="34" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1035" y="82" text-anchor="middle" class="f" font-size="12.5" font-weight="600" fill="#334155">⚙ 公众号配置</text>
    <line x1="64" y1="110" x2="1136" y2="110" stroke="#EEF2F6" stroke-width="1"/>

    <!-- 左列：封面与元数据 -->
    <text x="100" y="142" class="f" font-size="13" font-weight="700" fill="#475569">公众号封面图（2.35:1 · 自动上传微信素材库）</text>
    <rect x="100" y="154" width="448" height="174" rx="14" fill="url(#covGrad5)"/>
    <rect x="124" y="178" width="136" height="22" rx="11" fill="#10B981" fill-opacity="0.22"/>
    <text x="192" y="193" text-anchor="middle" class="f" font-size="11.5" font-weight="700" fill="#6EE7B7">FEATURED · 深度拆解</text>
    <text x="124" y="242" class="f" font-size="22" font-weight="700" fill="#FFFFFF">AI 时代的内容创作新范式</text>
    <rect x="124" y="258" width="54" height="3.5" rx="2" fill="#34D399"/>
    <text x="124" y="288" class="f" font-size="13.5" fill="#D1FAE5">写稿、去 AI 味、智能排版到推送草稿箱一次跑通</text>

    <text x="100" y="356" class="f" font-size="13" font-weight="700" fill="#475569">最终文章标题</text>
    <rect x="100" y="366" width="448" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="116" y="391" class="f" font-size="13.5" fill="#0F172A">AI 时代的内容创作新范式：3 分钟跑通公众号工作流</text>

    <text x="100" y="432" class="f" font-size="13" font-weight="700" fill="#475569">发布目标公众号</text>
    <rect x="100" y="442" width="448" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="118" cy="462" r="5" fill="#07C160"/>
    <text x="132" y="467" class="f" font-size="13.5" font-weight="600" fill="#0F172A">我的AI效率笔记（默认 · 已联通）</text>
    <text x="530" y="467" text-anchor="end" class="f" font-size="13" fill="#64748B">▾</text>

    <!-- 红框 2：推送成功与防丢图回读校验 -->
    <rect x="92" y="498" width="464" height="58" rx="12" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="92" cy="498" r="14" fill="#EF4444"/>
    <text x="92" y="503" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <rect x="100" y="506" width="448" height="42" rx="9" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
    <text x="118" y="532" class="f" font-size="13.5" font-weight="700" fill="#065F46">✓ 已成功推送至公众号草稿箱，并通过回读防丢图校验！</text>

    <!-- 右列：终稿完整预览 -->
    <rect x="580" y="136" width="520" height="420" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="604" y="168" class="f" font-size="14" font-weight="700" fill="#0F172A">终稿完整预览</text>
    <rect x="954" y="148" width="124" height="26" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1016" y="165" text-anchor="middle" class="f" font-size="11.5" font-weight="600" fill="#059669">✓ 已转存微信图床</text>

    <rect x="606" y="186" width="468" height="350" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="630" y="224" class="f" font-size="18" font-weight="700" fill="#0F172A">AI 时代的内容创作新范式</text>
    <text x="630" y="248" class="f" font-size="12" fill="#64748B">我的AI效率笔记 · 墨玉绿主题 · 16px · 预计阅读 3 分钟</text>

    <rect x="630" y="268" width="420" height="72" rx="10" fill="#ECFDF5"/>
    <rect x="630" y="268" width="4" height="72" rx="2" fill="#07C160"/>
    <text x="648" y="296" class="f" font-size="13.5" font-weight="700" fill="#065F46">核心要点提炼</text>
    <text x="648" y="322" class="f" font-size="13" fill="#047857">正文插图与封面均自动上传微信官方图床，杜绝外链失效。</text>

    <text x="630" y="378" class="f" font-size="15.5" font-weight="700" fill="#0F172A">01 · 告别繁琐的手动复制粘贴</text>
    <text x="630" y="408" class="f" font-size="13.5" fill="#334155">在节点 ⑤ 点击右下角「一键发布到公众号草稿箱」，系统</text>
    <text x="630" y="434" class="f" font-size="13.5" fill="#334155">会自动完成正文图片上传、草稿写入与回读防丢图校验，</text>
    <text x="630" y="460" class="f" font-size="13.5" fill="#334155">推送完成后直接打开微信公众平台「草稿箱」即可群发。</text>

    <!-- 底部操作栏 -->
    <line x1="64" y1="572" x2="1136" y2="572" stroke="#EEF2F6" stroke-width="1"/>
    <rect x="100" y="586" width="140" height="36" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="170" y="609" text-anchor="middle" class="f" font-size="13.5" font-weight="600" fill="#334155">📋 复制富文本</text>

    <!-- 红框 1：一键发布主按钮 -->
    <rect x="852" y="578" width="256" height="52" rx="12" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="852" cy="578" r="14" fill="#EF4444"/>
    <text x="852" y="583" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <rect x="860" y="585" width="240" height="38" rx="9" fill="#07C160"/>
    <text x="980" y="609" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#FFFFFF">🚀 一键发布到公众号草稿箱</text>
  </g>
</svg>
